<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EspToolbox</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #FEF7FF;
      --primary: #00677C;
      --on-primary: #FFFFFF;
      --text: #1D1B20;
      --muted: #49454F;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Google Sans Flex", "Google Sans", "Roboto Flex", Roboto, system-ui, sans-serif;
      line-height: 1.6;
    }
    .wrap {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 4rem 1.5rem 2.5rem;
    }
    h1 {
      margin: 0 0 1.5rem;
      font-size: clamp(3.2rem, 11vw, 6rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      line-height: 1.05;
      color: var(--text);
    }
    .lead {
      margin: 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: clamp(1.4rem, 3.5vw, 1.8rem);
      line-height: 1.45;
    }
    .links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
    }
    .chip {
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      padding: 0.8rem 1.8rem;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      color: var(--text);
      border: 1px solid rgba(29, 27, 32, 0.4);
      transition: opacity 0.15s ease;
    }
    .chip:hover { opacity: 0.85; }
    footer {
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>EspToolbox</h1>
      <p class="lead">Configure your ESP boards in a simple and fast way, directly over USB.</p>
    </header>

    <div>
      <div class="links">
        <a class="chip" href="privacy.html">Privacy Policy</a>
        <a class="chip" href="terms.html">Terms &amp; Conditions</a>
      </div>
      <footer>&copy; 2026 EspToolbox</footer>
    </div>
  </div>
</body>
</html>
